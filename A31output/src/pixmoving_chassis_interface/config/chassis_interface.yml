/**:
  ros__parameters:
    # 小计里程 ptm 融合参数
    enable_fused_ptm: true                 # 是否启用 ptm 融合；false 时回退到底盘原始 trip
    ndt_pos_q_threshold: 2.3               # NDT 可靠性阈值；当前实现中数值越小越可靠
    ndt_timeout_sec: 1.0                   # NDT pose / 质量数据超时阈值 (秒)
    gnss_timeout_sec: 1.0                  # GNSS fix 数据超时阈值 (秒)
    chassis_speed_timeout_sec: 0.5         # 底盘速度数据超时阈值 (秒)
    standstill_speed_threshold_mps: 0.2    # 静止速度阈值；低于该值时严格抑制 NDT/GNSS 漂移累计
    ndt_jump_reject_threshold_m: 5.0       # NDT 单帧位移跳变丢弃阈值 (米)
    gnss_jump_reject_threshold_m: 20.0     # GNSS 单帧位移跳变丢弃阈值 (米)
    max_delta_ratio: 2.5                   # 位移与速度积分预测的放宽倍数；用于抑制异常跳点
    raw_trip_sync_threshold_m: 12.0        # 与底盘原始 trip 做上电同步/重置判定的阈值 (米)
    gnss_warmup_frames: 3                  # GNSS 连续有效预热帧数；达到后才允许参与里程累计

    # 舒适性相关阈值
    jerk_uncomfortable_threshold: 3.5  # 不舒适起步 (planning 加加速度)，单位 m/s^3
    accel_limit: 1.8                   # 加速度极限值，单位 m/s^2
    comfort_jerk_clear_threshold: 2.8  # 不舒适急动度恢复阈值
    comfort_accel_clear_limit: 1.44    # 不舒适加速度恢复阈值
    comfort_bad_count_threshold: 3     # 连续异常帧数达到后触发不舒适
    comfort_good_count_threshold: 5    # 连续正常帧数达到后恢复正常
    comfort_min_event_duration_sec: 0.5  # 不舒适事件最小持续时间
    near_miss_trigger_accel: 3.0       # 危险事件触发阈值（按 abs(ax) 判定，且 abs(az)>12.0 时抑制触发）
    near_miss_clear_accel: 2.0         # 危险事件消失阈值（按 abs(ax) <= 2.0 清除）
    imu_timeout_sec: 1.0               # IMU 数据超时后 has_near_miss 回到未知

    # 稳定性相关阈值
    stability_mean_limit: 0.12  # 整体偏差阈值
    frechet_limit: 2.0         # 形状畸变阈值
    local_disp_limit: 0.05     # 局部跳变阈值
    lookahead_max_limit: 0.08  # 前瞻最大跳变阈值
    stability_mean_clear_limit: 0.064      # 整体偏差恢复阈值
    frechet_clear_limit: 0.4               # 形状畸变恢复阈值
    local_disp_clear_limit: 0.012          # 局部跳变恢复阈值
    lookahead_max_clear_limit: 0.012       # 前瞻最大跳变恢复阈值
    stability_bad_count_threshold: 3       # 连续异常帧数达到后触发突变
    stability_good_count_threshold: 10     # 连续正常帧数达到后恢复正常
    stability_min_event_duration_sec: 0.5  # 轨迹突变事件最小持续时间
    stability_require_autonomous_mode: true       # 仅自驾模式下允许触发轨迹突变事件
    stability_suppress_when_stopped: true          # 车辆静止时抑制轨迹突变事件
    stability_standstill_speed_threshold_mps: 0.2  # 稳定性静止速度阈值
    stability_require_route_lane: true             # 当前 ego lane 必须在有效 route 上才允许触发轨迹突变
    stability_require_auto_executing_mode: true    # 仅 Pixmoving mode=5 自驾执行时允许触发轨迹突变
    comfort_require_auto_executing_mode: true      # 仅 Pixmoving mode=5 自驾执行时允许触发舒适性异常
    comfort_suppress_on_brake_pedal: true          # 人工刹车期间及释放后抑制舒适性异常
    comfort_brake_release_suppression_sec: 10.0    # 人工刹车释放后的舒适性抑制时长（秒）
