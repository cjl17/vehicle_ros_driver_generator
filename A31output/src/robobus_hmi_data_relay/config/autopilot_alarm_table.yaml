# Minimal autopilot alarm table for the first /diagnostics -> /auto/diagnostics pass.
# Scope: localization and planning only. Hardware, control, and system resource alarms are
# intentionally kept out of this first pass.
# Source: docs/RoboBus告警码表汇总-260106.xlsx sheet 告警码表(自驾).
# Verified against docs/failcase_data_20260914091932_238.mcap.zst.
#
# Alarm level: INFO=0, WARN=1, ERROR=2, FATAL=3.
# Alarm type: OCCUR=0, RECOVER=1, EVENT=2.
# DiagnosticStatus level: OK=0, WARN=1, ERROR=2, STALE=3.
alarms:
  - code: 0x0202000A
    level: 2
    type: 0
    name: "pcd_map_load_error"
    msg: "点云地图加载异常"
    rules:
      - diagnostic_name: "topic_state_monitor_pointcloud_map: map_topic_status"
        diagnostic_level: 2

  - code: 0x0202000B
    level: 2
    type: 0
    name: "vector_map_load_error"
    msg: "矢量地图加载异常"
    rules:
      - diagnostic_name: "topic_state_monitor_vector_map: map_topic_status"
        diagnostic_level: 2

  - code: 0x02040011
    level: 1
    type: 0
    name: "trajectory_topic_rate_warn"
    msg: "规划轨迹话题频率降低"
    rules:
      - diagnostic_name: "topic_state_monitor_scenario_planning_trajectory: planning_topic_status"
        value_key: "topic"
        value: "/planning/scenario_planning/trajectory"
        diagnostic_level: 1

  - code: 0x02040012
    level: 2
    type: 0
    name: "trajectory_topic_rate_error"
    msg: "规划轨迹话题频率显著降低"
    rules:
      - diagnostic_name: "topic_state_monitor_scenario_planning_trajectory: planning_topic_status"
        value_key: "topic"
        value: "/planning/scenario_planning/trajectory"
        diagnostic_level: 2
